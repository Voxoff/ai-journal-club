<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 497" width="828" height="497" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f9c"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ec4b6"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b942"/>
    </marker>
  </defs>

  <rect width="828" height="497" fill="#010409"/>

  <!-- faint baseline grid -->
  <g stroke="#1e2330" stroke-width="1">
    <line x1="60" y1="120" x2="768" y2="120"/>
    <line x1="60" y1="380" x2="768" y2="380"/>
  </g>

  <!-- encoder cells -->
  <g fill="#010409" stroke="#2ec4b6" stroke-width="2.5">
    <circle cx="130" cy="250" r="20"/>
    <circle cx="230" cy="250" r="20"/>
    <circle cx="330" cy="250" r="20"/>
  </g>

  <!-- encoder recurrence -->
  <g stroke="#8a8f9c" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="152" y1="250" x2="208" y2="250"/>
    <line x1="252" y1="250" x2="308" y2="250"/>
    <line x1="352" y1="250" x2="408" y2="250"/>
  </g>

  <!-- encoder inputs, reversed -->
  <g stroke="#2ec4b6" stroke-width="1.5" fill="none" marker-end="url(#arrTeal)">
    <line x1="130" y1="330" x2="130" y2="273"/>
    <line x1="230" y1="330" x2="230" y2="273"/>
    <line x1="330" y1="330" x2="330" y2="273"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9ccd4" text-anchor="middle">
    <text x="130" y="356">x<tspan font-size="10" dy="3">3</tspan></text>
    <text x="230" y="356">x<tspan font-size="10" dy="3">2</tspan></text>
    <text x="330" y="356">x<tspan font-size="10" dy="3">1</tspan></text>
  </g>

  <!-- context vector -->
  <circle cx="440" cy="250" r="34" fill="#0d1a3c" stroke="#2f5bd6" stroke-width="2.5"/>
  <text x="440" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6e8ee" text-anchor="middle">v</text>

  <!-- context to decoder -->
  <line x1="476" y1="250" x2="528" y2="250" stroke="#8a8f9c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- decoder cells -->
  <g fill="#010409" stroke="#e8404b" stroke-width="2.5">
    <circle cx="550" cy="250" r="20"/>
    <circle cx="650" cy="250" r="20"/>
    <circle cx="750" cy="250" r="20"/>
  </g>

  <!-- decoder recurrence -->
  <g stroke="#8a8f9c" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="572" y1="250" x2="628" y2="250"/>
    <line x1="672" y1="250" x2="728" y2="250"/>
  </g>

  <!-- decoder outputs -->
  <g stroke="#f4b942" stroke-width="1.5" fill="none" marker-end="url(#arrAmber)">
    <line x1="550" y1="227" x2="550" y2="170"/>
    <line x1="650" y1="227" x2="650" y2="170"/>
    <line x1="750" y1="227" x2="750" y2="170"/>
  </g>
  <g fill="#010409" stroke="#9aa0ad" stroke-width="1.5">
    <circle cx="550" cy="150" r="14"/>
    <circle cx="650" cy="150" r="14"/>
    <circle cx="750" cy="150" r="14"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9ccd4" text-anchor="middle">
    <text x="550" y="155">ŷ<tspan font-size="8" dy="2">1</tspan></text>
    <text x="650" y="155">ŷ<tspan font-size="8" dy="2">2</tspan></text>
    <text x="750" y="155">ŷ<tspan font-size="8" dy="2">3</tspan></text>
  </g>

  <!-- fed back as next input -->
  <g stroke="#f4b942" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrAmber)">
    <path d="M564 150 Q612 150 640 226"/>
    <path d="M664 150 Q712 150 740 226"/>
  </g>

  <!-- section labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7d8291">
    <text x="230" y="105" text-anchor="middle">encoder</text>
    <text x="650" y="105" text-anchor="middle">decoder</text>
  </g>

  <!-- input order hint -->
  <line x1="330" y1="400" x2="130" y2="400" stroke="#f4b942" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="230" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7d8291" text-anchor="middle">input reversed</text>
</svg>
