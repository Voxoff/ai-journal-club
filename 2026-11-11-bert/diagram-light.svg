<svg width="100%" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Bidirectional attention with a masked token</title>
<desc>Six tokens, the [MASK] of the river was, each pass through the shared weight matrices W Q, W K and W V to give a query, key and value. The six by six score grid has no causal mask, so every cell is live, and the [MASK] row attends both left to the and right to river. The attention weights then mix the value vectors: A times v1 to v6 gives H.</desc>
