<svg width="100%" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A causal attention head reading a few-shot prompt</title>
<desc>Five tokens, cat = chat dog =, pass through the shared weight matrices W Q, W K and W V to give a query, key and value each. The five by five score grid masks every cell above the diagonal with minus infinity. The last row, the second equals sign, attends most to dog and chat. A times v1 to v5 gives H, and the model predicts the next token, chien.</desc>
