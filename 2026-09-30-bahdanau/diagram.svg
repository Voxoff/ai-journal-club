<svg width="100%" viewBox="-36 -46 1152 562" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, -apple-system, system-ui, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Encoder-decoder with attention (Bahdanau, Cho and Bengio, 2014)</title>
<desc>A bidirectional RNN encodes five source words. At each decoder step, alignment weights computed from the previous decoder state and each encoder state form a context vector as a weighted sum, and the decoder emits the next output word. The output word rive draws most of its weight from bank and river.</desc>
